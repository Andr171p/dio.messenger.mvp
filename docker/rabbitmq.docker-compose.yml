services:
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME:-messenger}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-messenger}
    ports:
      - "${RABBIT_PORT:-5674}:5672"
      - "${RABBIT_MANAGEMENT_PORT:-15674}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
