resolver 127.0.0.11 valid=10s ipv6=off;
set $api http://api:8002;
set $rustfs http://rustfs:9000;

client_max_body_size 50m;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

location = /health/live {
    proxy_pass $api;
}

location = /health/ready {
    proxy_pass $api;
}

location ^~ /v1/system/ {
    return 404;
}

location = /v1/ws {
    access_log off;
    # Nginx inherits proxy_set_header only when the location sets none.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
    proxy_pass $api;
}

location ^~ /v1/ {
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass $api;
}

location ^~ /messenger-media/messenger/ {
    limit_except GET PUT {
        deny all;
    }

    # SigV4 authenticates the original Host, URI and query string.
    access_log off;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    proxy_pass $rustfs;
}
