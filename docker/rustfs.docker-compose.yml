services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.1}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-messenger}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-messenger-dev-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${RUSTFS_PORT:-9010}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9011}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/health || curl -fsS http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-messenger}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-messenger-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-messenger-media}
    volumes:
      - ./rustfs/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]

volumes:
  rustfs-data:
