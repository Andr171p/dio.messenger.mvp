[project]
name = "messenger-back"
version = "0.1.0"
description = "DIO Messenger — backend service"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.16",
    "asyncpg>=0.31.0",
    "py-ddd-framework[s3,sqlalchemy,rabbit,redis]",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.35",
]

[tool.uv.sources]
py-ddd-framework = { git = "https://github.com/Andr171p/py-ddd-framework.git" }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 110

extend-exclude = [
    "cli",
    "migrations",
    "migration",
    "src/migrations",
    "alembic.ini",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.venv",
    "**/*.md",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "ASYNC",
    "FAST",
    "B",
    "C4",
    "PIE",
    "RET",
    "SIM",
    "ARG",
    "PL",
    "PERF",
    "RUF",
    "LOG",
]

ignore = [
    "S101",
    "ARG001",
    "PLC0415",
    "TID252",
    "RUF001",
    "RUF002",
    "RUF003",
    "ASYNC109",
    "N805",
    "PLW3201",
    "PLW1641",
    "TRY003",
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "typing",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"typing" = ["typing"]

[tool.ruff.lint.pylint]
max-args = 15
max-returns = 10
max-branches = 30

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ARG001", "F401", "PLR6301", "PLR2004"]
"migrations/**/*" = ["S101", "ARG001", "F401", "PLR6301", "I001", "ERA001"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
files = ["src"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
pretty = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
exclude = [
    "(^|/)\\.venv/",
    "(^|/)migrations/",
]

[[tool.mypy.overrides]]
module = [
    "ddf.infra.database.sqlalchemy",
    "ddf.infra.database.sqlalchemy.*",
]
ignore_errors = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require PostgreSQL (set INTEGRATION=1 or POSTGRES_* / DATABASE_URL)",
]
