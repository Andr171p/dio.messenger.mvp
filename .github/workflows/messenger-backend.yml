name: Messenger Backend

on:
  push:
    paths:
      - "messenger.back/**"
      - ".github/workflows/messenger-backend.yml"
  pull_request:
    paths:
      - "messenger.back/**"
      - ".github/workflows/messenger-backend.yml"

defaults:
  run:
    working-directory: messenger.back

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run pytest tests/unit -q

  migrate-integration:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: messenger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: messenger
          RABBITMQ_DEFAULT_PASS: messenger
        ports:
          - 5672:5672
          - 15672:15672
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBIT_HOST: localhost
      RABBIT_PORT: 5672
      RABBIT_USERNAME: messenger
      RABBIT_PASSWORD: messenger
      INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration -q